base_cfg: "configs/base.yaml"

tta_dataset:
  name: "graspnet1b"
  camera: "realsense"  # Camera split [realsense/kinect]
  split: "test_similar_mixed_mini"  # Data split [test/test_seen/test_similar/test_novel/test_seen_mini]

eval_dataset:
  name: "graspnet1b"
  camera: "realsense"  # Camera split [realsense/kinect]
  split: "test_similar_mixed_mini"  # Data split [test/test_seen/test_similar/test_novel/test_seen_mini]

# Model settings
model:
  ckpt_path: "ckpts/economicgrasp_realsense.tar"

tta:
  batch_size: 1
  method: "tta-grasp"  # Test Time Adaptation methods [none/ema/cotta/testadagrasp/tent/bn-1/alpha-bn]
  ema_ratio: 0.99  # EMA ratio
  rst_ratio: 0.1  # Restore ratio
  aug_types: "none,hflip"  # Augmentation types for teacher ensemble
  lr: 1e-5 # Learning rate for TTA
  optimizer: "sgd"
  optimizer_momentum: 0.99
  min_grasps: 0
  loss_type: "graspness,view,objectness"

  geval_net:
    model: "dgcnn"
    ckpt_path: "../grasp_qnet/ckpts/grasp_qnet.tar"
    max_grasp_num: 512
    batch_size: 128
    min_points: 512
    grasp_q_thresh: 0.5 # Grasp score threshold
    uncertainty_thresh: 0.00 # Uncertainty threshold
    uncertainty_n : 10
